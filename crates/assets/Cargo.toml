[package]
name = "assets"
version = "0.1.0"
edition = "2024"

[features]
debug = ["serde_path_to_error"]

[dependencies]
serde_path_to_error = { version = "0.1.20", optional = true }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
