[package]
name = "mc-resources"
version = "0.1.0"
edition = "2024"

[features]
debug = ["serde_path_to_error"]

[dependencies]
platform = { path = "../platform" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = { version = "0.1.20", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
] }
safe-path = { path = "../safe-path" }
tempfile = "3.27.0"
sha1 = "0.11.0"
hex = "0.4.3"
url = { version = "2.5.8", features = ["serde"] }
regex = "1.13.1"

[dev-dependencies]
mockito = "1.7.2"
