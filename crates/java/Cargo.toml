[package]
name = "java"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.48", features = ["tokio", "gzip"] }
async_zip = { version = "0.0.19", features = ["deflate", "tokio", "tokio-fs"] }
futures = "0.3.34"
platform = { path = "../platform" }
reqwest = "0.13.5"
sanitize-filename = "0.6.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "process",
  "macros",
  "rt",
  "rt-multi-thread",
] }
tokio-tar = "0.3.1"
tokio-util = { version = "0.7.19", features = ["compat"] }
